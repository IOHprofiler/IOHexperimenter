name: Ubuntu

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:


env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug


jobs:
  build-test-cpp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-12, g++-13, g++-14, clang++-18]
    env:
      CXX: ${{ matrix.compiler }}
      # test binaries load problem data during static initialization
      IOH_RESOURCES: ${{ github.workspace }}/static

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      run: cmake --build build --config $BUILD_TYPE --target test_ioh --parallel

    - name: Test
      run: build/tests/test_ioh

  build-test-python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and newest available Python
        python-version: ["3.10", "3.x"]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install library
      run: |
        python -m pip install --upgrade pip
        pip install -e . -v
    - name: Run unit tests
      run: python -m unittest -v

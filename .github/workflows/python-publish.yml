# builds and tests the wheels; uploads them for releases
name: Wheels

on:
  release:
    # 'created' does not fire for releases published from a draft
    types: [published]
  workflow_dispatch:
  # the full matrix once a week (pull requests skip macOS, see below); off the full hour, when
  # GitHub delays scheduled runs
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    # everything that ends up in, or is tested against, the wheels
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "ioh/**"
      - "static/**"
      - "tools/**"
      - "external/**"
      - "VERSION"
      - "README.md"
      - "LICENSE.md"
      - ".gitmodules"
      - ".github/workflows/python-publish.yml"
      - "tests/python/golden.py"
      - "tests/python/test_golden.py"
      - "tests/data/golden/**"

concurrency:
  # a new push to a pull request cancels its previous run. Other runs are never cancelled while
  # they run, but a newer run in the same group replaces one that is still waiting.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_wheels:
    name: Build ${{ matrix.python }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # native runners: x86_64 and aarch64 Linux, x64 and ARM64 Windows, Intel and arm64 macOS.
        # Pull requests skip macOS: the organization runs at most 20 jobs at once, only 5 of them on
        # macOS, and the Intel ones are slow, so with macOS a pull request waited ~35 instead of
        # ~10-15 minutes for its wheels. Weekly, manual and release runs build everything.
        os: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2022", "windows-11-arm"]')
          || fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2022", "windows-11-arm", "macos-15-intel", "macos-15"]') }}
        # one wheel per job: cp310, cp311, the abi3 wheel for CPython 3.12 and later (built with 3.12 and
        # tested with 3.12-3.15 in one job: cibuildwheel reuses an abi3 wheel only within one run), and
        # the free-threaded wheels, which cannot be abi3
        python: [cp310, cp311, cp312-abi3, cp314t, cp315t]
        exclude:
          # numpy has no Windows ARM64 wheels for Python 3.10
          - { os: windows-11-arm, python: cp310 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
          # the rest of the configuration is in pyproject.toml
          CIBW_BUILD: >-
            ${{ matrix.python == 'cp312-abi3' && 'cp312-* cp313-* cp314-* cp315-*'
            || format('{0}-*', matrix.python) }}
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build sdist
        run: pipx run build --sdist

      # the sdist lists its files explicitly (pyproject.toml): building from it shows that none is missing
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install from the sdist and test
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          python -m pip install dist/*.tar.gz
          python tests/python/test_golden.py

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  check_packages:
    name: Data files in the packages
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Every wheel and the sdist hold exactly the data files of static/manifest.json
        run: python3 tools/gen_manifest.py --check-package dist/*.whl dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist, check_packages]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

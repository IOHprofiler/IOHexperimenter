name: Windows

on:
  push:
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug


jobs:
  build-test-cpp:
    runs-on: windows-2022
    env:
      # test binaries load problem data during static initialization
      IOH_RESOURCES: ${{ github.workspace }}/static
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Configure CMake
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      shell: bash
      run: cmake --build build --config $BUILD_TYPE --target test_ioh --parallel

    - name: Test
      shell: bash
      run: build/tests/$BUILD_TYPE/test_ioh.exe

  build-test-python:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and newest available Python; 32-bit only while win32 wheels are shipped
        python-version: ["3.10", "3.x"]
        architecture: [x64]
        include:
          - python-version: "3.10"
            architecture: x86

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: Install library
      run: |
        python -m pip install --upgrade pip
        pip install -e . -v
    - name: Run unit tests
      run: python -m unittest -v

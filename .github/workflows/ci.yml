name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  # a new push to a pull request cancels its previous run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: g++-12 }
          - { os: ubuntu-24.04, compiler: g++-13 }
          - { os: ubuntu-24.04, compiler: g++-14 }
          - { os: ubuntu-24.04, compiler: clang++-18 }
          - { os: macos-15, compiler: clang++ }
          - { os: windows-2022, compiler: msvc }
    env:
      # test binaries load problem data during static initialization
      IOH_RESOURCES: ${{ github.workspace }}/static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure CMake
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          ${{ matrix.compiler != 'msvc' && format('-DCMAKE_CXX_COMPILER={0}', matrix.compiler) || '' }}

      - name: Build
        run: cmake --build build --config Debug --target test_ioh --parallel 4

      - name: Test
        # multi-config generators (Visual Studio) put the binary in a Debug/ subdirectory
        run: |
          if [ -x build/tests/test_ioh ]; then build/tests/test_ioh; else build/tests/Debug/test_ioh.exe; fi

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        # oldest supported and newest available
        python: ["3.10", "3.x"]
    env:
      # setup.py only bounds the build on Linux; unbounded jobs make the 7 GB macOS runner swap
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install library
        run: |
          python -m pip install --upgrade pip
          pip install -e . -v

      - name: Run unit tests
        run: python -m unittest -v

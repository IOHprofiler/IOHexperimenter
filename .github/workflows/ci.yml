name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  # a new push to a pull request cancels its previous run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: static/ matches static/manifest.json, and static.tar.gz matches static/
        run: |
          python3 tools/gen_manifest.py --check
          python3 tools/static_tarball.py --check

  cpp:
    name: C++ tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # with the oldest CMake the project supports (CMakeLists.txt)
          - { os: ubuntu-24.04, compiler: g++-12, cmake: "3.16.8" }
          - { os: ubuntu-24.04, compiler: g++-13 }
          - { os: ubuntu-24.04, compiler: g++-14 }
          - { os: ubuntu-24.04, compiler: clang++-18 }
          - { os: macos-15, compiler: clang++ }
          - { os: windows-2022, compiler: msvc }
    # no IOH_RESOURCES: the tests find the data in the source tree, the default of the build
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install CMake ${{ matrix.cmake }}
        if: matrix.cmake
        run: |
          pipx install cmake==${{ matrix.cmake }}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # a compiler cache, also of the master branch for pull requests (not on Windows: the Visual Studio
      # generator cannot use a compiler launcher)
      - uses: hendrikmuhs/ccache-action@v1.2.24
        if: runner.os != 'Windows'
        with:
          key: cpp-${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M

      - name: Configure CMake
        run: >
          cmake --version &&
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          ${{ matrix.compiler != 'msvc'
          && format('-DCMAKE_CXX_COMPILER={0} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache', matrix.compiler) || '' }}

      - name: Build
        run: cmake --build build --config Debug --target test_ioh --parallel 4

      - name: Test
        # multi-config generators (Visual Studio) put the binary in a Debug/ subdirectory
        run: |
          if [ -x build/tests/test_ioh ]; then build/tests/test_ioh; else build/tests/Debug/test_ioh.exe; fi

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        # oldest supported and newest available
        python: ["3.10", "3.x"]
    env:
      # unbounded Ninja jobs make the 7 GB macOS runner swap
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # a compiler cache, as for the C++ tests
      - uses: hendrikmuhs/ccache-action@v1.2.24
        if: runner.os != 'Windows'
        with:
          key: python-${{ matrix.os }}-${{ matrix.python }}
          max-size: 500M

      - name: Install library
        env:
          # CMake reads it from the environment (CMake 3.17 and later; scikit-build-core uses a newer one)
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'ccache' || '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . -v

      - name: Run unit tests
        run: python -m unittest -v

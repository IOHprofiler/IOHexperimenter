[build-system]
# nanobind is pinned: its version shapes the extension and the generated stubs
requires = ["scikit-build-core>=1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ioh"
dynamic = ["version"]
description = "The experimenter for Iterative Optimization Heuristics"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [
    { name = "Jacob de Nobel" },
    { name = "Furong Ye" },
    { name = "Diederick Vermetten" },
    { name = "Hao Wang" },
    { name = "Carola Doerr" },
    { name = "Thomas Bäck" },
    { name = "IOHprofiler", email = "iohprofiler@liacs.leidenuniv.nl" },
]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage = "https://iohprofiler.github.io/IOHexperimenter"

[tool.scikit-build]
minimum-version = "build-system.requires"
# FindPython with Development.Module (ioh/CMakeLists.txt); for an older CMake than 3.26 scikit-build-core brings the
# FindPython that has Development.SABIModule (the abi3 wheel)
cmake.version = ">=3.18"
# kept between builds, so that a rebuild (pip install --no-build-isolation -e .) only compiles what changed
build-dir = "build/{wheel_tag}"
# the extension and the data files (ioh/CMakeLists.txt), not the C++ library's headers and CMake package
install.components = ["python"]
wheel.packages = ["ioh"]
# one wheel for CPython 3.12 and later, built on the stable ABI (ioh/CMakeLists.txt); 3.10, 3.11 and the
# free-threaded builds get a wheel of their own (nanobind builds them on the stable ABI only in its split mode,
# which needs the nanobind-backend package; TASKS.md T6.7)
wheel.py-api = "cp312"
# the sources of the extension are only in the sdist
wheel.exclude = ["ioh/src/", "ioh/CMakeLists.txt", "ioh/README.md"]
# The sdist holds what building the package needs, and only that. The Python files of the wheel are
# taken from the same list.
sdist.inclusion-mode = "explicit"
sdist.include = [
    "/pyproject.toml",
    "/VERSION",
    "/README.md",
    "/LICENSE.md",
    "/CONTRIBUTING.md",
    "/CMakeLists.txt",
    "/cmake/",
    "/include/",
    "/src/",
    "/ioh/",
    "/static/",
    "/external/fmt/CMakeLists.txt",
    "/external/fmt/LICENSE",
    "/external/fmt/*.md",
    "/external/fmt/include/",
    "/external/fmt/src/",
    "/external/fmt/support/cmake/",
]
# ioh/static links to static/ for editable installs; the wheel gets static/ from the CMake install
sdist.exclude = ["/ioh/static", "__pycache__/", "*.pyc", "*.so", "*.pyd", ".DS_Store"]

[tool.scikit-build.cmake.define]
BUILD_PYTHON_PACKAGE = "ON"
BUILD_TESTS = "OFF"
BUILD_EXAMPLE = "OFF"
BUILD_DOCS = "OFF"
ENABLE_MKLANDSCAPE_PROBLEMS = "OFF"
# compile the C++ sources in batches (a unity build): they share most of their headers and templates, so a clean
# build takes about half as long; a rebuild after changing one file compiles its batch again (TASKS.md WP7)
CMAKE_UNITY_BUILD = "ON"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '(?P<value>\d+\.\d+\.\d+\S*)'

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-* cp314t-* cp315t-*"
# no 32-bit Windows; musllinux was never shipped
skip = "*-win32 *-musllinux_*"
# freezes the Python-visible registry and problem behaviour (tests/python/golden.py), and evaluates from several
# threads (on the free-threaded wheels without the GIL)
test-command = "python {project}/tests/python/test_golden.py && python {project}/tests/python/test_threads.py"
build-verbosity = 1

[tool.cibuildwheel.linux.environment]
# Ninja runs two jobs more than there are cores; the builds use 4, as before, to stay within memory
CMAKE_BUILD_PARALLEL_LEVEL = "4"

[tool.cibuildwheel.macos.environment]
# std::filesystem needs macOS 10.15 (scikit-build-core passes it on to CMake and the wheel tag); with
# cibuildwheel's Intel defaults (10.9/10.13) delocate rejects the x86_64 wheels. arm64 is raised to 11.0.
MACOSX_DEPLOYMENT_TARGET = "10.15"
# unbounded Ninja jobs make the 7 GB arm64 runners swap
CMAKE_BUILD_PARALLEL_LEVEL = "3"
